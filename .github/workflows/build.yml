name: Build HyperBounce Release

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore release keystore
        run: |
          mkdir -p "$HOME/keystore"
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$HOME/keystore/HyperBounce.jks"

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: /home/runner/keystore/HyperBounce.jks
          RELEASE_KEY_ALIAS: hyperbounce
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Release
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HyperBounce-v1.0.${{ github.run_number }}.apk

      - name: Create release tag
        env:
          TAG_NAME: v1.0.${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists — keeping existing tag"
          else
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HyperBounce Release #${{ github.run_number }}
          body: "Automated HyperBounce LSPosed build - Unified Instagram + WhatsApp + YouTube floating nav, plus HyperOS liquid glass toggles/sliders/keypad"
          files: app/build/outputs/apk/release/HyperBounce-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
